<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PPT</title>
    <style>
      body {
        margin: 0;
        background: #fff;
        color: #00141a;
        font:
          14px/1.4 'Segoe UI',
          sans-serif;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 12px 16px;
        background: #fff;
        border-bottom: 1px solid rgba(0, 20, 26, 0.08);
      }
      button {
        height: 32px;
        padding: 0 14px;
        border: 1px solid rgba(0, 20, 26, 0.08);
        border-radius: 16px;
        background: #fff;
      }
      button.primary {
        border: none;
        background: #00141a;
        color: #fff;
      }
      button.current {
        border-color: #14a6ea;
      }
      button.add-slide {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        width: 100%;
        height: auto;
        margin: 0 0 14px;
        padding: 0;
        border: none;
        border-radius: 0;
        background: transparent;
      }
      .add-card {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        width: 148px;
        height: 84px;
        border: 1px dashed rgba(0, 20, 26, 0.28);
        border-radius: 2px;
        background: #fff;
        color: rgba(0, 20, 26, 0.55);
        font-size: 28px;
        line-height: 1;
      }
      button.thumb {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        width: 100%;
        height: auto;
        margin: 0 0 14px;
        padding: 0;
        border: none;
        border-radius: 0;
        background: transparent;
      }
      button.thumb canvas {
        flex: none;
        width: 148px;
        background: #fff;
        box-shadow: none;
        outline: 1px solid rgba(0, 20, 26, 0.16);
      }
      button.thumb:hover canvas {
        outline: 2px solid #14a6ea;
      }
      button.thumb.current .thumb-index {
        color: #d24726;
        font-weight: 700;
      }
      button.thumb.current canvas,
      button.thumb.current:hover canvas {
        outline: 2px solid #d24726;
      }
      button.thumb.dragging {
        opacity: 0.55;
      }
      button.thumb.drop-before canvas {
        box-shadow: inset 0 3px 0 #14a6ea;
      }
      button.thumb.drop-after canvas {
        box-shadow: inset 0 -3px 0 #14a6ea;
      }
      .slide-menu {
        position: fixed;
        z-index: 5;
        display: flex;
        flex-direction: column;
        min-width: 112px;
        padding: 4px;
        background: #fff;
        border: 1px solid rgba(0, 20, 26, 0.12);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 20, 26, 0.16);
      }
      .slide-menu[hidden] {
        display: none;
      }
      .slide-menu button {
        height: 32px;
        padding: 0 10px;
        border: none;
        border-radius: 6px;
        background: transparent;
        text-align: left;
      }
      .slide-menu button:hover {
        background: #f2f4f5;
      }
      .thumb-index {
        flex: none;
        width: 18px;
        padding-top: 2px;
        color: rgba(0, 20, 26, 0.55);
        font-size: 12px;
        text-align: right;
      }
      #file-name {
        flex: 1;
        overflow: hidden;
        color: rgba(0, 20, 26, 0.62);
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button:disabled {
        opacity: 0.45;
      }
      main {
        display: flex;
        height: calc(100vh - 57px);
      }
      .thumbs {
        flex: none;
        width: 216px;
        height: 100%;
        padding: 16px 12px 16px 8px;
        overflow: auto;
        background: #e8eaec;
        box-sizing: border-box;
      }
      .stage {
        display: flex;
        flex: 1;
        justify-content: center;
        min-width: 0;
        height: 100%;
        padding: 24px;
        overflow: auto;
        background: #f3f5f6;
        box-sizing: border-box;
      }
      .sheet {
        position: relative;
        align-self: flex-start;
        height: fit-content;
      }
      canvas {
        display: block;
        background: #fff;
      }
      .sheet canvas {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }
      #editor-frame {
        position: absolute;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #editor-frame[hidden] {
        display: none;
      }
      #editor {
        width: 100%;
        min-height: 1em;
        outline: none;
        background: transparent;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        caret-color: currentColor;
      }
    </style>
  </head>
  <body>
    <header>
      <button id="open" type="button">打开</button>
      <input
        id="file"
        type="file"
        accept=".pptx,application/vnd.openxmlformats-officedocument.presentationml.presentation"
        hidden
      />
      <span id="file-name">点「打开」选择 pptx。这个页面读不到磁盘目录。</span>
      <button id="discard" type="button" disabled>放弃</button>
      <button id="save" class="primary" type="button" disabled>保存</button>
    </header>
    <main>
      <nav id="thumbs" class="thumbs" aria-label="幻灯片">
        <button id="add-slide" class="add-slide" type="button" disabled aria-label="新增幻灯片">
          <span class="thumb-index" aria-hidden="true"></span>
          <span class="add-card">+</span>
        </button>
      </nav>
      <div class="stage">
        <div class="sheet" id="sheet">
          <canvas id="slide"></canvas>
          <div id="editor-frame" hidden>
            <div
              id="editor"
              contenteditable="true"
              spellcheck="false"
              role="textbox"
              aria-multiline="true"
              aria-label="幻灯片文字"
            ></div>
          </div>
        </div>
      </div>
    </main>
    <div id="slide-menu" class="slide-menu" hidden role="menu">
      <button id="copy-slide" type="button" role="menuitem">复制</button>
      <button id="delete-slide" type="button" role="menuitem">删除</button>
    </div>
    <script type="module" src="./editor.js?v=13"></script>
  </body>
</html>
